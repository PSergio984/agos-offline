name: CI Pipeline

'on':
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt flake8

      - name: Run lint check with flake8
        run: |
          flake8 backend/app backend/tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run linter with ruff
        run: |
          ruff check --config ruff.toml backend/app backend/tests

      - name: Run tests with pytest
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests -v

  frontend-ci:
    name: Frontend CI (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter & typecheck
        working-directory: frontend
        run: npm run lint

      - name: Run production build
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test
